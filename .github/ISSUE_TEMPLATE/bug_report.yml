name: 🐛 Bug Report
description: Report a reproducible problem or unexpected behavior in ULTRANSC
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us investigate and resolve it.
  - type: input
    id: version
    attributes:
      label: ULTRANSC Version
      description: What version of ULTRANSC are you running? (e.g. 0.8.0 or main branch)
      placeholder: "0.8.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Fedora/Other)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Docker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Place audio file 'sample.mp3' in queue/incoming/
        2. Run 'python -m ultransc'
        3. See error in logs/errors.log
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please paste any relevant error logs or tracebacks from `logs/errors.log`.
      render: shell
