# ULTRANSC configuration

# Model selection
MODEL=auto                      # auto | ggml-small.en.bin | ggml-medium.en.bin
AUTO_DOWNLOAD_MODEL=true        # Download default model when models/ is empty
MODEL_BASE_URL=https://huggingface.co/ggerganov/whisper.cpp/resolve/main

# Processing limits
MAX_DURATION=10800              # Max file duration in seconds
MIN_FREE_DISK_MB=500            # Minimum free disk space before starting a job

# Audio preprocessing
TARGET_LOUDNESS=-18             # Target loudness used for gain calculation

# Whisper settings
THREADS=auto                    # auto | number
PREFER_METAL=true               # Use --metal on macOS when supported
LANGUAGE=en
WHISPER_CMD=auto                # auto | whisper-cli | whisper-cpp | whisper | path
WHISPER_ARGS=                   # Extra whisper-cli args, shell-style quoted

# Performance
FAST_MODE=auto                  # auto = false on macOS, true on Linux
WHISPER_SPEED_PRESET=fast       # max | fast | balanced | quality
FFMPEG_THREADS=auto             # auto | number
STAGE2_MAX_DURATION=0           # 0 = no duration limit for Stage 2

# URL downloads
YTDLP_FORMAT=bestaudio
YTDLP_EXTRA_ARGS=--extractor-args youtube:skip=dash
YTDLP_MAX_FILESIZE=             # Optional cap, for example 500M

# Queue and recovery
ENABLE_CRASH_RECOVERY=true
AUTO_CLEANUP_TEMP=true
RUN_PREFLIGHT=false             # Normal runs skip preflight unless enabled

# Retry logic
MAX_RETRIES=3
RETRY_BACKOFF_BASE=5
RETRY_BACKOFF_MULTIPLIER=2
